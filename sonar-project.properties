sonar.projectKey=cognihire
sonar.projectName=CogniHire
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend,frontend
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*.py

sonar.python.version=3.11
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.coverage.exclusions=backend/tests/**,**/__pycache__/**,**/migrations/**

sonar.exclusions=venv/**,.venv/**,data/**,uploads/**,htmlcov/**,.pytest_cache/**,.mypy_cache/**,.ruff_cache/**,**/__pycache__/**,chroma_db/**

sonar.qualitygate.wait=true
